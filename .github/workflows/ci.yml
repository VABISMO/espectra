name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Tests + build
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt ruff

      - name: Instalar y compilar interfaz
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Lint (errores reales)
        run: ruff check --select F,E9 espectro scripts server.py tests

      - name: Demo end-to-end (motor + calibración LED + biblioteca)
        run: python -m espectro demo

      - name: Tests (motor + API + cámara)
        run: python tests/run_tests.py

      - name: La interfaz se sirve
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import server
          r = TestClient(server.app).get("/")
          assert r.status_code == 200 and "ESPECTRA" in r.text, r.status_code
          print("frontend served OK")
          PY

  frontend-types:
    name: Frontend compila
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
